# SonarCloud configuration for CI-based analysis.
#
# Automatic Analysis is switched off for this project: it cannot import test
# coverage. The scan is run from .github/workflows/ci.yml, after pytest has
# written coverage.xml.

sonar.projectKey=SuryaKiran434_Cineverse
sonar.organization=suryakiran434

# The app is a flat set of top-level modules rather than a package, so each one
# is named explicitly -- this mirrors the --cov list in the workflow. A bare `.`
# would drag in tests/ and any local venv.
sonar.sources=auth.py,auth_helpers.py,config.py,database.py,main.py,models.py,protected.py,tmdb.py,watchlist.py
sonar.tests=tests

# pytest is invoked with --cov-report=xml, which writes coverage.xml to the
# repository root.
sonar.python.coverage.reportPaths=coverage.xml

# Never analysis targets: vendored/installed dependencies and the test suite
# (the latter is declared above as tests, not sources).
sonar.exclusions=**/venv/**,**/.venv/**,**/node_modules/**,tests/**

sonar.python.version=3.13
sonar.sourceEncoding=UTF-8
