name: CI

# Runs the test suite on every pull request, and on main after merge.
# The suites are fully offline: they stub the `database` module in
# sys.modules and fake the DB connection, so no MySQL service is needed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # This name becomes the status-check context. Keep it stable — it is what
    # a branch protection rule would reference.
    name: Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # SonarCloud needs the full history to attribute code to authors and
          # to work out what counts as "new code"; a shallow clone breaks both.
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      # The pinned runtime dependencies are installed for real, so that a
      # Dependabot bump of PyJWT / requests / python-dotenv is genuinely
      # exercised by the tests rather than rubber-stamped. This is the whole
      # point of the job — do not swap this for a slimmed-down install list.
      #
      # `--only-binary :all:` makes pip refuse source distributions, so no
      # package's setup.py executes on the runner. Verified against the
      # runner's target (cp313/manylinux): every distribution pip resolves here
      # has a wheel -- mysql-connector-python, pydantic-core, SQLAlchemy,
      # bcrypt and greenlet included -- so this constrains what pip is allowed
      # to do without changing what it installs. Quoted because a plain YAML
      # scalar may not end in a colon.
      - name: Install runtime dependencies
        run: "pip install -r requirements.txt --only-binary :all:"

      # pytest runs the suite; httpx is required by fastapi.testclient.TestClient,
      # which tests/test_watchlist_authz.py uses. httpx is a *test-only* dependency
      # and is deliberately not added to requirements.txt, which stays the pinned
      # runtime set that Dependabot manages.
      # pytest-cov is likewise test-only and stays out of requirements.txt.
      # Pinned to the versions CI already resolved, so this locks the set rather
      # than moving it. The cost: Dependabot reads manifests, not ad-hoc pip
      # command lines, so these three are manual maintenance from here.
      - name: Install test dependencies
        run: "pip install pytest==9.1.1 httpx==0.28.1 pytest-cov==7.1.0 --only-binary :all:"

      # The app is a flat set of top-level modules rather than a package, so
      # each one is named explicitly — `--cov=.` would drag in tests/ and venv/.
      # Note: database.py is listed but will not appear in the report, because
      # tests/conftest.py installs a stub `database` module in sys.modules
      # before it can ever be imported.
      - name: Run tests
        run: |
          python -m pytest -q \
            --cov=auth --cov=auth_helpers --cov=config --cov=database \
            --cov=main --cov=models --cov=protected --cov=tmdb --cov=watchlist \
            --cov-report=xml --cov-report=term

      - name: Coverage summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print("## Coverage")
          print()
          print(f"**{rate * 100:.2f}%** of statements in the application modules covered.")
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

      # Runs after the tests so coverage.xml already exists. Configuration lives
      # in sonar-project.properties at the repo root.
      #
      # Analysis is advisory, not a gate: continue-on-error keeps a SonarCloud
      # outage or a scanner hiccup from failing the required check.
      - name: SonarCloud analysis
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
